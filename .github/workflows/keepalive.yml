# .github/workflows/keepalive.yml  （強化版）
#
# 変更点（★印）
#   - 更新結果が「ちょうど1行」でなければ失敗にする
#     （設計書 7-2b のRLS事故のように、HTTP 200 のまま 0件更新で静かに止まるのを検知）
#   - permissions を空に（このジョブは GITHUB_TOKEN を一切使わない）
#   - Secrets は env 経由、HTTPステータスと本文を必ずログに出してから判定（失敗原因を追跡できる）、timeout 追加
#   - 依存コマンドは curl / jq（ubuntu-latest に標準搭載）のみ
#
# 注意: publicリポジトリでは、60日間リポジトリ活動がないとスケジュール実行が
#       自動で無効化される（GitHubの仕様）。メールが届いたら Actions タブから再有効化する。

name: Supabase Keepalive

on:
  schedule:
    - cron: '0 0 * * 0,3' # 日・水 UTC 0:00
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase to prevent auto-pause
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail

          resp_file="$(mktemp)"

          # 想定エラー: ネットワーク断 -> curl が非0終了（--retry で3回まで再試行）
          http_code="$(curl -sS --retry 3 --max-time 30 \
            -o "${resp_file}" -w '%{http_code}' \
            -X PATCH "${SUPABASE_URL}/rest/v1/keepalive_pings?id=eq.1" \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d "{\"pingedAt\": \"$(date -u +%Y-%m-%dT%H:%M:%S)Z\"}")"

          # 本文は成否にかかわらず先にログへ出す（401/403/42501 の原因調査のため）
          echo "HTTP ${http_code}"
          cat "${resp_file}"
          echo

          # 想定エラー: 認証失敗(401/403)・GRANT/RLS不備(403 + 42501) など 2xx 以外
          case "${http_code}" in
            2??) ;;
            *) echo "::error::keepalive request failed (HTTP ${http_code})"; exit 1 ;;
          esac

          # 想定エラー: 0件更新（行が無い・ポリシーで弾かれた）/ 2件以上（想定外）
          if ! jq -e 'type == "array" and length == 1' "${resp_file}" >/dev/null; then
            echo "::error::keepalive_pings was not updated exactly once. Check RLS policies / row id=1."
            exit 1
          fi
          
